<!DOCTYPE html>
<html>
	<head>
		<title>6D NOISE HYPERCUBE!</title>
		<link rel="stylesheet" href="all.css">
		<link rel="stylesheet" href="slices.css">
		<link rel="icon" href="favicon.ico" />
		<script src="colours.js" type="text/javascript"></script>
		<script src="slices.js" type="text/javascript"></script>
	</head>
	<body>
		<div id="ta">
			<h1 id="title">Single 2D Slice 6D Noise Hypercube Visualizer</h1>
			<p id="author">By <a href="https://maximumg9.com">MaximumG9</a> // Source Available on <a href="https://github.com/MaximumG9/NoiseHypercube">GitHub</a></p>
		</div>
		<canvas id="visual"></canvas>
		<div id="slider-container">
			<div>
				<select id="versionDropdown">
					<option value="1.21.11">1.21.11</option>
					<option value="26.2">26.2</option>
				</select>
				<div id="randomizeButtonContainer">	
					<button id="randomizeButton">EXPLORE THE HYPERCUBE</button>
				</div>
			</div>
			<select id="xAxis">
				<option value=0 selected>Temperature</option>
				<option value=1>Humidity</option>
				<option value=2>Erosion</option>
				<option value=3>Continentalness</option>
				<option value=4>Depth</option>
				<option value=5>Weirdness</option>
			</select>
			<select id="yAxis">
				<option value=0>Temperature</option>
				<option value=1>Humidity</option>
				<option value=2>Erosion</option>
				<option value=3>Continentalness</option>
				<option value=4>Depth</option>
				<option value=5 selected>Weirdness</option>
			</select>
			<div id="slide0">
				<input type="range" min="-1" max="1" value="0" step="0.01" class="slider">
				<span class="slider-label">Text</span>
			</div>
			<div id="slide1">
				<input type="range" min="-1" max="1" value="0" step="0.01" class="slider">
				<span class="slider-label">Text</span>
			</div>
			<div id="slide2">
				<input type="range" min="-1" max="1" value="0" step="0.01" class="slider">
				<span class="slider-label">Text</span>
			</div>
			<div id="slide3">
				<input type="range" min="-1" max="1" value="0" step="0.01" class="slider">
				<span class="slider-label">Text</span>
			</div>
		</div>
	</body>
</html>
